<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>You're invited</title>
</head>
<body style="margin:0;padding:0;background:#0b0d12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8eaf0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0d12;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#161922;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="padding:28px 32px 8px 32px;">
                            <div style="font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#8a93a6;">{{serverName}}</div>
                            <h1 style="margin:8px 0 0 0;font-size:22px;font-weight:600;color:#ffffff;">You're invited</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px 8px 32px;font-size:15px;line-height:1.55;color:#c8cdd9;">
                            <p style="margin:0 0 16px 0;">You've been invited to create an account on {{serverName}} using <strong style="color:#ffffff;">{{inviteEmail}}</strong>.</p>
                            <p style="margin:0 0 16px 0;">Click the button below to set up your account. This invitation is single-use.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 24px 32px;">
                            <a href="{{inviteLink}}" style="display:inline-block;background:#f97316;color:#0b0d12;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:8px;">Accept invitation</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 28px 32px;font-size:13px;line-height:1.55;color:#8a93a6;">
                            <p style="margin:0;word-break:break-all;">If the button doesn't work, paste this link into your browser:<br><span style="color:#c8cdd9;">{{inviteLink}}</span></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
