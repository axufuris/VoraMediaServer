<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Email test</title>
</head>
<body style="margin:0;padding:0;background:#0b0d12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e8eaf0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0d12;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#161922;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="padding:28px 32px 8px 32px;">
                            <div style="font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#8a93a6;">{{serverName}}</div>
                            <h1 style="margin:8px 0 0 0;font-size:22px;font-weight:600;color:#ffffff;">SMTP test successful</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px 28px 32px;font-size:15px;line-height:1.55;color:#c8cdd9;">
                            <p style="margin:0 0 12px 0;">If you're reading this, your SMTP configuration on {{serverName}} works.</p>
                            <p style="margin:0;color:#8a93a6;font-size:13px;">This message was sent from the admin email settings test button.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
