name: PR Checks

# Nothing used to run on a pull request. deploy-qa runs on push to main —
# that is AFTER a merge — and deploy-prod only on a release, so a PR could be
# merged without anything having built or tested it. This is the check that
# gives branch protection something to require.
on:
  pull_request:
    branches: [ main ]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-20, and the FFmpeg
    # below comes from Jellyfin's repository for this release.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VORA_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      BUILD_CONFIGURATION: ${{ secrets.SIXLABORS_LICENSE_KEY != '' && 'Release' || 'Debug' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vora.slnx

      - name: Note a pull request without the licence
        if: env.BUILD_CONFIGURATION == 'Debug'
        run: echo "::notice::This pull request comes from a fork, which GitHub gives no secrets, so it is built and tested in Debug, where a missing Six Labors licence is only a warning. main is still tested in Release after the merge."

      # Build separately from test so a compile failure reads as a compile
      # failure in the log rather than as a test run that never started.
      - name: Build
        run: dotnet build Vora.slnx --no-restore --configuration "$BUILD_CONFIGURATION"

      # Tests that start a real encode, like the GPU-failure retry, skip
      # without FFmpeg on PATH. They run against jellyfin-ffmpeg7, installed
      # the way src/Vora.Api/Dockerfile installs it, so they test the FFmpeg
      # the server ships rather than whatever the runner's Ubuntu carries
      # (8.0 on 26.04, where the external subtitle burn-in tests time out).
      - name: Install FFmpeg
        run: |
          . /etc/os-release
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
          echo "deb [signed-by=/etc/apt/keyrings/jellyfin.gpg] https://repo.jellyfin.org/${ID} ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/jellyfin.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jellyfin-ffmpeg7
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffmpeg /usr/local/bin/ffmpeg
          sudo ln -sf /usr/lib/jellyfin-ffmpeg/ffprobe /usr/local/bin/ffprobe
          ffmpeg -hide_banner -version | head -n 1

      - name: Test
        run: dotnet test Vora.slnx --no-restore --configuration "$BUILD_CONFIGURATION" --verbosity minimal

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Vora.Web
    steps:
      - uses: actions/checkout@v5

      # Matches the node the Dockerfile's ui-build stage uses, so a PR cannot
      # pass here and then fail the image build after merge.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Vora.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:run, not test — the latter is `vitest` in watch mode and would
      # hang the runner until it timed out.
      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
