name: PR Checks

# Nothing used to run on a pull request. deploy-qa runs on push to main —
# that is AFTER a merge — and deploy-prod only on a release, so a PR could be
# merged without anything having built or tested it. This is the check that
# gives branch protection something to require.
on:
  pull_request:
    branches: [ main ]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vora.slnx

      # Build separately from test so a compile failure reads as a compile
      # failure in the log rather than as a test run that never started.
      - name: Build
        run: dotnet build Vora.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Vora.slnx --no-restore --configuration Release --verbosity minimal

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Vora.Web
    steps:
      - uses: actions/checkout@v5

      # Matches the node the Dockerfile's ui-build stage uses, so a PR cannot
      # pass here and then fail the image build after merge.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/Vora.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # test:run, not test — the latter is `vitest` in watch mode and would
      # hang the runner until it timed out.
      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
