name: Deploy Production

on:
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vora-media-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vora.slnx

      - name: Test
        run: dotnet test Vora.slnx --no-restore --configuration Release --verbosity minimal

  build-and-push:
    name: Build & Push (Production)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Vora.Api/Dockerfile
          # amd64-only. Our deploy targets (Unraid, generic Linux, Windows via
          # Docker) are all x86-64. Building linux/arm64 here runs under QEMU
          # emulation on the amd64 runner and dominates build time (5-10x
          # slower, since the Dockerfile compiles .NET + the React app from
          # source). To also publish an arm64 image (e.g. Raspberry Pi), append
          # ",linux/arm64" below — the QEMU step above is left in place so this
          # is a one-line change. For frequent arm64 builds, prefer a native
          # ubuntu-24.04-arm runner matrix over emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (table to log)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report-${{ github.event.release.tag_name }}
          path: trivy-report.json
          retention-days: 90
